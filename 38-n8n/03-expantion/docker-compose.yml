services:
  mysql:
    image: mysql:8.4
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: app123
      MYSQL_DATABASE: expenses_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: app123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "appuser", "-papp123"]
      interval: 10s
      timeout: 5s
    restart: unless-stopped

  server:
    build: ./server
    ports:
      - 3105:3105
    environment:
      PORT: 3105
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: app123
      DB_NAME: expenses_db
      N8N_ALERT_URL: http://n8n:5678/webhook/big-expense
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3105/health"]

    
  # the React client (nginx): http://localhost:8080
  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

  # n8n: http://localhost:5678 (from n8n to the server: http://server:3105)
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Jerusalem
      - TZ=Asia/Jerusalem
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mysql_data:
  n8n_data: