services:
  mysql:
    image: mysql:8.4
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: app123
      MYSQL_DATABASE: expenses_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: app123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "appuser", "-papp123"]
      interval: 10s
      timeout: 5s
    restart: unless-stopped

  server:
    build: ./server
    ports:
      - 3105:3105
    environment:
      PORT: 3105
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: app123
      DB_NAME: expenses_db
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3105/health"]

volumes:
  mysql_data: